services:
  plesk:
    build:
      context: ../latest/
      args:
        LICENSE: A00700-TEFT12-W88534-JGH917-MBFE93
    logging:
      driver: none
    ports:
      ["8443:8443"]
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
    cgroup: host
  tests:
    build: .
    depends_on:
      - plesk
    links:
      - plesk
    volumes:
      - .:/opt/tests/
    command: /opt/tests/wait-for-plesk.sh
